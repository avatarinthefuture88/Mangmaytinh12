    const p1 = document.createElement('div');
    p1.className = 'packet';
    p1.style.background = '#38bdf8';
    p1.innerHTML = 'Gói Seq #1';
    pLayer.appendChild(p1);

    animateElement(p1, { left: '18%', top: '150px' }, { left: '50%', top: '290px' }, 450, () => {
        animateElement(p1, { left: '50%', top: '290px' }, { left: '82%', top: '150px' }, 450, () => {
            p1.remove();
            if (buf) {
                buf.innerHTML = `<div style="background:#38bdf8; color:#fff; padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:bold; margin:2px;">Seq #1</div>`;
            }
        });
    });

    // 2. Gửi Seq #2 bình thường (delay 250ms)
    setTimeout(() => {
        const p2 = document.createElement('div');
        p2.className = 'packet';
        p2.style.background = '#10b981';
        p2.innerHTML = 'Gói Seq #2';
        pLayer.appendChild(p2);

        animateElement(p2, { left: '18%', top: '150px' }, { left: '50%', top: '290px' }, 450, () => {
            animateElement(p2, { left: '50%', top: '290px' }, { left: '82%', top: '150px' }, 450, () => {
                p2.remove();
                if (buf) {
                    const b2 = document.createElement('div');
                    b2.style.cssText = 'background:#10b981; color:#fff; padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:bold; margin:2px;';
                    b2.innerText = 'Seq #2';
                    buf.appendChild(b2);
                }
            });
        });
    }, 250);

    // 3. Gói Seq #3 bị LỖI / RỚT MẠNG TẠI ROUTER! (delay 500ms)
    setTimeout(() => {
        const p3 = document.createElement('div');
        p3.className = 'packet';
        p3.style.background = '#f59e0b';
        p3.innerHTML = 'Gói Seq #3';
        pLayer.appendChild(p3);

        // Chạy tới Router rồi gặp sự cố
        animateElement(p3, { left: '18%', top: '150px' }, { left: '50%', top: '290px' }, 500, () => {
            Sound.warn();
            p3.style.background = '#ef4444';
            p3.style.border = '2px solid #fee2e2';
            p3.style.boxShadow = '0 0 15px #ef4444';
            p3.innerHTML = '💥 LỖI CHECKSUM / RỚT MẠNG!';

            setTimeout(() => {
                p3.remove(); // Gói tin bị hủy bỏ
            }, 700);
        });
    }, 500);

    // 4. Gói Seq #4 vẫn đến Server (delay 800ms)
    setTimeout(() => {
        const p4 = document.createElement('div');
        p4.className = 'packet';
        p4.style.background = '#c084fc';
        p4.innerHTML = 'Gói Seq #4';
        pLayer.appendChild(p4);

        animateElement(p4, { left: '18%', top: '150px' }, { left: '50%', top: '290px' }, 450, () => {
            animateElement(p4, { left: '50%', top: '290px' }, { left: '82%', top: '150px' }, 450, () => {
                p4.remove();
                if (buf) {
                    // Hiển thị vị trí khuyết thiếu gói Seq #3
                    const missingDiv = document.createElement('div');
                    missingDiv.id = 'tab5MissingSlot';
                    missingDiv.style.cssText = 'background:rgba(239,68,68,0.2); border:1px dashed #ef4444; color:#f87171; padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:bold; margin:2px; animation:pulse 1s infinite;';
                    missingDiv.innerText = '❓ KHUYẾT THIẾU #3';
                    buf.appendChild(missingDiv);

                    const b4 = document.createElement('div');
                    b4.style.cssText = 'background:#c084fc; color:#fff; padding:3px 8px; border-radius:4px; font-size:0.75rem; font-weight:bold; margin:2px;';
                    b4.innerText = 'Seq #4';
                    buf.appendChild(b4);
                }

                if (recBox) {
                    recBox.style.color = '#ef4444';
                    recBox.innerText = '⚠️ CHƯA THỂ TÁI HỢP: ĐANG THIẾU MẢNH SEQ #3!';
                }

                // 5. SERVER PHÁT TÍN HIỆU YÊU CẦU GỬI LẠI (NACK / Duplicate ACK) về Client
                setTimeout(() => {
                    const ackP = document.createElement('div');
                    ackP.className = 'packet';
                    ackP.style.background = '#f97316';
                    ackP.innerHTML = '🔁 Yêu cầu gửi lại Seq #3';
                    pLayer.appendChild(ackP);

                    animateElement(ackP, { left: '82%', top: '150px' }, { left: '18%', top: '150px' }, 700, () => {
                        ackP.remove();
                        Sound.packet();

                        // 6. PHÍA GỬI (CLIENT) TỰ ĐỘNG TRUYỀN LẠI GÓI SEQ #3 (RETRANSMISSION)
                        const p3Retransmit = document.createElement('div');
                        p3Retransmit.className = 'packet';
                        p3Retransmit.style.background = '#e11d48';
                        p3Retransmit.style.boxShadow = '0 0 12px #f43f5e';
                        p3Retransmit.innerHTML = '🔄 Seq #3 (Truyền Lại)';
                        pLayer.appendChild(p3Retransmit);

                        animateElement(p3Retransmit, { left: '18%', top: '150px' }, { left: '50%', top: '290px' }, 450, () => {
                            animateElement(p3Retransmit, { left: '50%', top: '290px' }, { left: '82%', top: '150px' }, 450, () => {
                                p3Retransmit.remove();
                                Sound.ding();

                                // Điền mảnh vào vị trí khuyết thiếu
                                const missingSlot = document.getElementById('tab5MissingSlot');
                                if (missingSlot) {
                                    missingSlot.style.animation = 'none';
                                    missingSlot.style.border = 'none';
                                    missingSlot.style.background = '#10b981';
                                    missingSlot.style.color = '#fff';
                                    missingSlot.innerText = 'Seq #3 (Đã bù)';
                                }

                                if (recBox) {
                                    recBox.style.color = '#34d399';
                                    recBox.innerText = '✅ TÁI HỢP THÀNH CÔNG 100% SAU KHI TRUYỀN LẠI!';
                                }

                                setTimeout(() => {
                                    if (typeof showCenterAlert === 'function') {
                                        showCenterAlert(
                                            "CƠ CHẾ TỰ ĐỘNG TRUYỀN LẠI CỦA TCP (RETRANSMISSION)",
                                            "Khi gói tin Seq #3 bị lỗi đường truyền (sai Checksum) hoặc rớt mạng tại Router, TCP không bao giờ bỏ cuộc!\n\nPhía nhận phát hiện khuyết thiếu Seq #3 trong khay đệm (TCP Buffer) và yêu cầu gửi lại. Phía gửi lập tức tự động gửi lại (Retransmit) gói #3 cho đến khi đủ 100% dữ liệu.\n\nĐây là lý do TCP được gọi là Giao thức hướng kết nối tin cậy (Reliable Connection-Oriented Protocol)!",
                                            "success"
                                        );
                                    }
                                }, 1000);
                            });
                        });
                    });
                }, 800);
            });
        });
    }, 800);
}

                    • <b>HTTPS (Cổng 443):</b> Dữ liệu được mã hóa bằng giao thức bảo mật <b>SSL/TLS</b> trước khi gửi qua Internet. Dù kẻ xấu bắt được gói tin cũng chỉ thấy những ký tự hỗn loạn vô nghĩa!
                </div>
            </div>
        `;

                    • Sử dụng 2 kênh riêng biệt:<br>
                    - <b>Cổng 21 (Control Channel):</b> Truyền lệnh điều khiển (Đăng nhập, duyệt thư mục).<br>

                </div>
            </div>
            <div class="box-info">
                <div class="box-title">NGUYÊN LÝ HOẠT ĐỘNG CỦA LỆNH PING:</div>
                <div class="box-body">

                    2. Máy nhận nếu hoạt động bình thường sẽ phản hồi gói <b>ICMP Echo Reply (Trả lời vọng lại)</b>.<br>
                    3. Hệ điều hành tính toán thời gian đi về (RTT - Round Trip Time) tính bằng mili-giây (ms) và tỷ lệ mất gói tin (Packet Loss %).
                </div>
            </div>
            <div class="box-info">

function runDnsLookup() {
    Sound.packet();
    const dInfo = DNS_DATABASE[dnsDomainInput];
    const log = document.getElementById('dnsLogBox');
    if (!log) return;

    log.innerHTML = `[1/3] Trình duyệt gửi gói <b>DNS Query</b> đến Server 8.8.8.8 (Cổng 53 UDP) hỏi IP của <b>${dnsDomainInput}</b>...`;
    highlightDev('dnsClientBox', '#10b981');

    setTimeout(() => {
        Sound.packet();
        highlightDev('dnsServerBox', '#38bdf8');
        log.innerHTML += `<br>[2/3] Máy chủ DNS tra bảng thành công! Trả lời: <b>${dnsDomainInput}</b> &rarr; IP <b>${dInfo.ip}</b>`;

        setTimeout(() => {
            Sound.ding();
            highlightDev('webServerBox', '#f59e0b');
            log.innerHTML += `<br>[3/3] Trình duyệt kết nối trực tiếp đến IP <b>${dInfo.ip}</b> (Cổng 443 HTTPS)! Đã tải xong trang: <b>${dInfo.title}</b>!`;
        }, 800);
    }, 800);
}

function testHttpTransmit(mode) {
    Sound.packet();
    const isHttps = mode === 'https';
    const tunnel = document.getElementById('httpTunnel');
    const status = document.getElementById('tunnelStatus');
    const pDisp = document.getElementById('packetDisplay');
    const exp = document.getElementById('httpExplainBox');

    if (isHttps) {
        if (tunnel) tunnel.style.borderColor = '#10b981';
        if (status) { status.style.color = '#34d399'; status.innerHTML = '🔒 KÊNH MÃ HÓA HTTPS (SSL/TLS)'; }
        if (pDisp) { pDisp.style.color = '#34d399'; pDisp.innerHTML = 'Gói tin mã hóa: <code>e8b7c3d19f... (Mật khẩu an toàn tuyệt đối)</code>'; }

function startFtpTransfer(type) {
    Sound.packet();
    const bar = document.getElementById('ftpBar');
    const txt = document.getElementById('ftpText');
    if (!bar || !txt) return;

    if (ftpInterval) clearInterval(ftpInterval);
    ftpProgress = 0;
    bar.style.width = '0%';
    txt.innerText = type === 'upload' ? 'Đang Upload tệp lên máy chủ...' : 'Đang Download tệp về máy tính...';

    ftpInterval = setInterval(() => {
        ftpProgress += 10;
        bar.style.width = ftpProgress + '%';
        txt.innerText = `${type === 'upload' ? 'Uploading' : 'Downloading'}... ${ftpProgress}%`;
        if (ftpProgress >= 100) {
            clearInterval(ftpInterval);
            Sound.ding();
            txt.innerText = `✅ Hoàn tất truyền tệp qua Cổng 20 Data Channel!`;
        }
    }, 120);
}

// =========================================================================
function runIcmpPingDemo(target = 'router') {
    if (icmpPingRunning) return;
    icmpPingRunning = true;

    const term = document.getElementById('pingTerminal');
    const name = document.getElementById('pingTargetName');
    const ipEl = document.getElementById('pingTargetIp');
    const iconEl = document.getElementById('pingTargetIcon');
    const boxEl = document.getElementById('pingTargetBox');
    const hintEl = document.getElementById('pingTargetHint');
    const statusAnim = document.getElementById('icmpStatusAnim');
    const pLayer = document.getElementById('packetLayer');
    if (pLayer) pLayer.innerHTML = '';

    let targetInfo = {
        name: 'ROUTER DEFAULT GATEWAY',
        ip: '192.168.1.1',
        icon: '🛡️',
        color: '#38bdf8',
        concept: 'router',
        success: true,
        rtt: '<1ms',
        ttl: 64
    };

    if (target === 'google') {
        targetInfo = {
            name: 'GOOGLE PUBLIC DNS (WAN)',
            ip: '8.8.8.8',
            icon: '🌐',
            color: '#10b981',
            concept: 'server',
            success: true,
            rtt: '24ms',
            ttl: 118
        };
    } else if (target === 'lost' || target === 'timeout') {
        targetInfo = {
            name: 'MÁY LỖI / MẤT KẾT NỐI',
            ip: '192.168.1.250',
            icon: '❌',
            color: '#ef4444',
            concept: null,
            success: false,
            rtt: null,
            ttl: null
        };
    }

    currentPingConcept = targetInfo.concept;

    if (name) { name.innerText = targetInfo.name; name.style.color = targetInfo.color; }
    if (ipEl) ipEl.innerText = 'IP: ' + targetInfo.ip;
    if (iconEl) iconEl.innerText = targetInfo.icon;
    if (boxEl) {
        boxEl.style.borderColor = targetInfo.color;
        boxEl.style.boxShadow = `0 0 20px ${targetInfo.color}40`;
    }
    if (hintEl) {
        hintEl.style.display = 'none';
        hintEl.innerText = '';
    }

    let termText = `C:\\Users\\HocSinh> ping ${targetInfo.ip}\n\nPinging ${targetInfo.ip} with 32 bytes of data:\n`;
    if (term) term.innerText = termText;

    let packetIndex = 0;
    const totalPackets = 4;

    function sendNextPing() {
        if (packetIndex >= totalPackets) {
            icmpPingRunning = false;
            if (statusAnim) statusAnim.innerHTML = '<span style="color:#10b981; font-weight:bold;">✅ Đã hoàn tất 4 gói tin!</span>';

            if (targetInfo.success) {
                Sound.ding();
                termText += `\nPing statistics for ${targetInfo.ip}:\n`;
                termText += `    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),\n`;
                termText += `Approximate round trip times in milli-seconds:\n`;
                termText += `    Minimum = 0ms, Maximum = 2ms, Average = 1ms\n`;
                termText += `[TRẠNG THÁI]: KẾT NỐI MẠNG THÔNG SUỐT HOÀN TOÀN!\n`;
                if (term) {
                    term.innerText = termText;
                    term.scrollTop = term.scrollHeight;
                }

                setTimeout(() => {
                    if (typeof showCenterAlert === 'function') {
                        showCenterAlert(
                            "KIỂM TRA THÔNG MẠNG (ICMP PING) THÀNH CÔNG!",
                            `Đã truyền 4 gói tin ICMP Echo Request đến ${targetInfo.ip} (${targetInfo.name}) và nhận lại đủ 4 gói tin Echo Reply (0% loss).\n\nThời gian đáp ứng cực nhanh: ${targetInfo.rtt}. Kết nối mạng hoàn hảo!`,
                            "success"
                        );
                    }
                }, 800);
            } else {
                Sound.fail();
                termText += `\nPing statistics for ${targetInfo.ip}:\n`;
                termText += `    Packets: Sent = 4, Received = 0, Lost = 4 (100% loss),\n`;
                termText += `[LỖI]: KHÔNG THỂ KẾT NỐI VỚI THIẾT BỊ NÀY (REQUEST TIMED OUT)!\n`;
                if (term) {
                    term.innerText = termText;
                    term.scrollTop = term.scrollHeight;
                }

                setTimeout(() => {
                    if (typeof showCenterAlert === 'function') {
                        showCenterAlert(
                            "CẢNH BÁO MẤT KẾT NỐI (100% LOSS)!",
                            `Cả 4 gói tin ICMP Echo Request đến ${targetInfo.ip} đều không nhận được phản hồi (Request timed out).\n\nThiết bị đích có thể chưa bật nguồn, cấu hình sai địa chỉ IP hoặc cáp mạng bị đứt!`,
                            "alert"
                        );
                    }
                }, 800);
            }
            return;
        }

        packetIndex++;
        if (statusAnim) statusAnim.innerHTML = `<span style="color:#38bdf8; font-weight:bold;">Đang truyền gói #${packetIndex}...</span>`;

        // Create Request packet: Client (~25%, 170) -> Target (~75%, 170)
        Sound.packet();
        const pReq = document.createElement('div');
        pReq.className = 'packet';
        pReq.style.background = '#38bdf8';
        pReq.style.boxShadow = '0 0 10px #38bdf8';
        pReq.innerHTML = `Echo Request #${packetIndex}`;
        if (pLayer) pLayer.appendChild(pReq);

        if (targetInfo.success) {
            // Success: Request travels to Target, then Reply travels back to Client
            animateElement(pReq, { left: '25%', top: '170px' }, { left: '75%', top: '170px' }, 400, () => {
                pReq.remove();
                Sound.packet();

                const pRep = document.createElement('div');
                pRep.className = 'packet';
                pRep.style.background = '#10b981';
                pRep.style.boxShadow = '0 0 10px #10b981';
                pRep.innerHTML = `Echo Reply #${packetIndex}`;
                if (pLayer) pLayer.appendChild(pRep);

                animateElement(pRep, { left: '75%', top: '170px' }, { left: '25%', top: '170px' }, 400, () => {
                    pRep.remove();
                    Sound.ding();
                    termText += `Reply from ${targetInfo.ip}: bytes=32 time=${targetInfo.rtt} TTL=${targetInfo.ttl}\n`;
                    if (term) {
                        term.innerText = termText;
                        term.scrollTop = term.scrollHeight;
                    }
                    setTimeout(sendNextPing, 200);
                });
            });
        } else {
            // Lost: Request travels halfway and drops
            animateElement(pReq, { left: '25%', top: '170px' }, { left: '50%', top: '170px' }, 400, () => {
                Sound.fail();
                pReq.style.background = '#ef4444';
                pReq.style.boxShadow = '0 0 12px #ef4444';
                pReq.innerHTML = `💥 Mất gói #${packetIndex}!`;
                setTimeout(() => {
                    pReq.remove();
                    termText += `Request timed out.\n`;
                    if (term) {
                        term.innerText = termText;
                        term.scrollTop = term.scrollHeight;
                    }
                    setTimeout(sendNextPing, 200);
                }, 350);
            });
        }
    }

    sendNextPing();
}

function runPingTarget(target) {
    runIcmpPingDemo(target);
}

    const submitSection = document.createElement('div');

    submitSection.innerHTML = `

    container.appendChild(submitSection);

    devLayer.appendChild(container);

    // Cập nhật sidebar
    updateQuizSidebar();
}

// Chuyển bài (Bài 3 / Bài 4)
function selectQuizLesson(lessonKey) {
    Sound.click();
    quizLesson = lessonKey;
    renderTab7_Quiz();
}

// CHỌN ĐÁP ÁN: Cập nhật trực tiếp DOM của câu đó, KHÔNG re-render toàn bộ -> MÀN HÌNH KHÔNG BỊ NHẢY VỀ ĐẦU!
function selectQuizAnswer(qIdx, optKey) {
    Sound.click();
    quizAnswers[quizLesson][qIdx] = optKey;

    const optKeys = ['A', 'B', 'C', 'D'];
    optKeys.forEach(k => {
        const optEl = document.getElementById(`quiz-opt-${qIdx}-${k}`);
        const iconEl = document.getElementById(`quiz-opt-icon-${qIdx}-${k}`);
        if (optEl && iconEl) {
            if (k === optKey) {
                optEl.style.background = 'rgba(2, 132, 199, 0.25)';
                optEl.style.border = '2px solid #38bdf8';
                optEl.style.color = '#ffffff';
                optEl.style.fontWeight = 'bold';
                optEl.style.boxShadow = '0 0 10px rgba(56,189,248,0.4)';
                iconEl.style.background = '#0284c7';
                iconEl.style.border = '1.5px solid #38bdf8';
            } else {
                optEl.style.background = '#1e293b';
                optEl.style.border = '1.5px solid #475569';
                optEl.style.color = '#f8fafc';
                optEl.style.fontWeight = 'normal';
                optEl.style.boxShadow = 'none';
                iconEl.style.background = '#0f172a';
                iconEl.style.border = '1.5px solid #64748b';
            }
        }
    });

    // Cập nhật card viền
    const qCard = document.getElementById(`quiz-q-${qIdx}`);
    if (qCard) qCard.style.borderColor = '#0284c7';

    // Cập nhật trạng thái
    const statusEl = document.getElementById(`quiz-status-${qIdx}`);
    if (statusEl) {
        statusEl.innerHTML = `<span style="color:#38bdf8; font-size:0.9rem; font-weight:bold; background:rgba(2,132,199,0.15); padding:4px 12px; border-radius:4px; border:1px solid #0284c7;">Đã chọn ${optKey}</span>`;
    }

    // Cập nhật số câu đã làm trên thanh tiến độ
    let count = 0;
    const currentQuiz = QUIZ_DATA[quizLesson];
    const userAnswers = quizAnswers[quizLesson];
    currentQuiz.questions.forEach((q, idx) => {
        if (userAnswers[idx]) count++;
    });
    const badgeCount = document.getElementById('quizAnsweredCount');
    if (badgeCount) badgeCount.textContent = count;
}

// NỘP BÀI & CHẤM ĐIỂM
function submitQuiz() {
    Sound.click();
    quizSubmitted[quizLesson] = true;

    const currentQuiz = QUIZ_DATA[quizLesson];
    const userAnswers = quizAnswers[quizLesson];
    let correctCount = 0;

    currentQuiz.questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
            correctCount++;
        }
    });

    if (correctCount >= 8) Sound.success();
    else if (correctCount >= 5) Sound.ding();
    else Sound.fail();

    // Hiển thị Modal chấm điểm với đúng 2 nút: Thoát & Xem Đáp Án
    showQuizScoreModal(correctCount);
}

// MODAL HIỂN THỊ ĐIỂM VÀ 2 NÚT (THOÁT, XEM ĐÁP ÁN)

    let modal = document.getElementById('quizResultModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'quizResultModal';
        modal.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); backdrop-filter:blur(6px); z-index:99999; display:flex; justify-content:center; align-items:center;';
        document.body.appendChild(modal);
    }

    const currentQuiz = QUIZ_DATA[quizLesson];
    const scoreColor = correctCount >= 8 ? '#10b981' : (correctCount >= 5 ? '#f59e0b' : '#ef4444');
    const shadowColor = correctCount >= 8 ? 'rgba(16,185,129,0.5)' : (correctCount >= 5 ? 'rgba(245,158,11,0.5)' : 'rgba(239,68,68,0.5)');

    let feedbackText = '';
    if (correctCount === 10) feedbackText = 'Tuyệt đối 10/10! Em đã nắm vững hoàn hảo toàn bộ kiến thức bài học.';
    else if (correctCount >= 8) feedbackText = 'Rất xuất sắc! Em hiểu bài sâu sắc và nắm chắc các thiết bị & giao thức mạng.';
    else if (correctCount >= 5) feedbackText = 'Khá tốt! Em đã đạt chuẩn kiến thức cốt lõi, hãy xem lại các câu chưa đúng để hoàn thiện hơn.';
    else feedbackText = 'Cần ôn tập thêm! Hãy xem phần đáp án rút gọn và xem lại mô phỏng các tab trước.';

    modal.innerHTML = `
        <div style="background:#0f172a; border:2px solid ${scoreColor}; border-radius:14px; max-width:560px; width:92%; padding:28px 24px; box-shadow:0 0 30px ${shadowColor}; text-align:center; animation:fadeInModal 0.25s ease;">
            <div style="font-size:1.6rem; font-weight:bold; color:#38bdf8; margin-bottom:6px; letter-spacing:0.5px;">
                🏆 KẾT QUẢ CHẤM ĐIỂM
            </div>
            <div style="font-size:1.05rem; color:#94a3b8; margin-bottom:14px;">
                ${currentQuiz.title}
            </div>

            <div style="background:rgba(15,23,42,0.8); border:2px solid #334155; border-radius:12px; padding:18px 10px; margin-bottom:16px;">
                <div style="font-size:1.0rem; color:#cbd5e1; font-weight:bold; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px;">
                    Số Điểm Đạt Được
                </div>
                <div style="font-size:3.6rem; font-weight:bold; color:${scoreColor}; line-height:1; text-shadow:0 0 20px ${shadowColor};">
                    ${correctCount} / 10
                </div>
                <div style="font-size:1.1rem; color:#cbd5e1; margin-top:10px;">
                    Số câu đúng: <b style="color:#10b981;">${correctCount}</b>/10 câu &bull; Chưa đúng: <b style="color:#ef4444;">${10 - correctCount}</b>/10 câu
                </div>
            </div>

            <div style="font-size:1.05rem; color:#e2e8f0; line-height:1.55; margin-bottom:24px; padding:0 10px;">

            </div>

            <div style="display:flex; justify-content:center; gap:16px;">
                <button class="btn btn-outline" style="font-size:1.1rem; font-weight:bold; padding:10px 28px; min-width:130px; border-radius:8px;" onclick="closeQuizModal()">
                    ❌ Thoát
                </button>
                <button class="btn btn-blue" style="font-size:1.1rem; font-weight:bold; padding:10px 30px; min-width:140px; border-radius:8px; box-shadow:0 0 12px rgba(2,132,199,0.4);" onclick="showBriefAnswersModal(${correctCount})">
                    👁️ Xem Đáp Án
                </button>
            </div>
        </div>
    `;

        function setDynamicCables(cables) {
            activeDynamicCables = cables;
            requestAnimationFrame(drawAllDynamicCables);
        }

        window.addEventListener('resize', () => {
            if (activeDynamicCables.length > 0) {
                drawAllDynamicCables();
            }
        });

        function drawAllDynamicCables() {
            const svg = document.getElementById('svgCables');
            const stage = document.getElementById('stageCanvas');
            if (!svg || !stage) return;

            svg.innerHTML = '';
            const sRect = stage.getBoundingClientRect();

            activeDynamicCables.forEach(conn => {
                const el1 = document.getElementById(conn.from);
                const el2 = document.getElementById(conn.to);
                if (!el1 || !el2) return;

                const r1 = el1.getBoundingClientRect();
                const r2 = el2.getBoundingClientRect();

                const c1 = [r1.left + r1.width / 2 - sRect.left, r1.top + r1.height / 2 - sRect.top];
                const c2 = [r2.left + r2.width / 2 - sRect.left, r2.top + r2.height / 2 - sRect.top];

                const dx = c2[0] - c1[0];
                const dy = c2[1] - c1[1];
                let p1 = [...c1];
                let p2 = [...c2];

                if (Math.abs(dx) > Math.abs(dy)) {
                    p1[0] = dx > 0 ? (r1.right - sRect.left) : (r1.left - sRect.left);
                    p2[0] = dx > 0 ? (r2.left - sRect.left) : (r2.right - sRect.left);
                } else {
                    p1[1] = dy > 0 ? (r1.bottom - sRect.top) : (r1.top - sRect.top);
                    p2[1] = dy > 0 ? (r2.top - sRect.top) : (r2.bottom - sRect.top);
                }

                if (conn.type === 'wifi') {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', p1[0]); line.setAttribute('y1', p1[1]);
                    line.setAttribute('x2', p2[0]); line.setAttribute('y2', p2[1]);
                    line.setAttribute('stroke', conn.color || '#a855f7');
                    line.setAttribute('stroke-width', '3.5');
                    line.setAttribute('stroke-dasharray', '8 6');
                    svg.appendChild(line);

                    const midX = (p1[0] + p2[0]) / 2;
                    const midY = (p1[1] + p2[1]) / 2;
                    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    txt.setAttribute('x', midX);
                    txt.setAttribute('y', midY - 6);
                    txt.setAttribute('fill', '#c084fc');
                    txt.setAttribute('font-size', '10.5');
                    txt.setAttribute('font-weight', '900');
                    txt.setAttribute('text-anchor', 'middle');
                    txt.textContent = '📶 Sóng Wi-Fi 5GHz';
                    svg.appendChild(txt);
                } else {
                    // Shadow
                    const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    shadow.setAttribute('x1', p1[0]); shadow.setAttribute('y1', p1[1] + 2);
                    shadow.setAttribute('x2', p2[0]); shadow.setAttribute('y2', p2[1] + 2);
                    shadow.setAttribute('stroke', 'rgba(0,0,0,0.7)');
                    shadow.setAttribute('stroke-width', '8');
                    shadow.setAttribute('stroke-linecap', 'round');
                    svg.appendChild(shadow);

                    // Cable body
                    const cable = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    cable.setAttribute('x1', p1[0]); cable.setAttribute('y1', p1[1]);
                    cable.setAttribute('x2', p2[0]); cable.setAttribute('y2', p2[1]);
                    cable.setAttribute('stroke', conn.color || '#0284c7');
                    cable.setAttribute('stroke-width', conn.width || '5');
                    cable.setAttribute('stroke-linecap', 'round');
                    if (conn.dashed) cable.setAttribute('stroke-dasharray', '8 4');
                    svg.appendChild(cable);

                    // RJ45 Connectors at endpoints
                    [p1, p2].forEach(p => {
                        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        circle.setAttribute('cx', p[0]);
                        circle.setAttribute('cy', p[1]);
                        circle.setAttribute('r', '5');
                        circle.setAttribute('fill', '#facc15');
                        circle.setAttribute('stroke', '#0f172a');
                        circle.setAttribute('stroke-width', '1.5');
                        svg.appendChild(circle);
                    });
                }
            });
        }

        function flyBetween(idFrom, idTo, durMs, onComplete) {
            const el1 = document.getElementById(idFrom);
            const el2 = document.getElementById(idTo);
            if (!el1 || !el2) { if (onComplete) onComplete(); return; }

            const stage = document.getElementById('stageCanvas');
            const sRect = stage.getBoundingClientRect();
            const r1 = el1.getBoundingClientRect();
            const r2 = el2.getBoundingClientRect();

            const x1 = r1.left + r1.width / 2 - sRect.left;
            const y1 = r1.top + r1.height / 2 - sRect.top;
            const x2 = r2.left + r2.width / 2 - sRect.left;
            const y2 = r2.top + r2.height / 2 - sRect.top;

            flyDot(x1, y1, x2, y2, durMs, onComplete);
        }

        // GENERAL HELPERS
        // =========================================================================
        function drawSvg(lines) {
            const svg = document.getElementById('svgCables');
            svg.innerHTML = '';
            lines.forEach(l => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', l.from[0]);
                line.setAttribute('y1', l.from[1]);
                line.setAttribute('x2', l.to[0]);
                line.setAttribute('y2', l.to[1]);
                line.setAttribute('stroke', l.color || '#475569');
                line.setAttribute('stroke-width', l.width || '3');
                if (l.dashed) line.setAttribute('stroke-dasharray', '6 4');
                svg.appendChild(line);
            });
        }

        function clearPackets() {
            document.getElementById('packetLayer').innerHTML = '';
            document.getElementById('fxLayer').innerHTML = '';
        }

        function flyDot(x1, y1, x2, y2, durMs, onComplete) {
            const layer = document.getElementById('packetLayer');
            const dot = document.createElement('div');
            dot.style.position = 'absolute';
            dot.style.width = '14px';
            dot.style.height = '14px';
            dot.style.background = '#06b6d4';
            dot.style.borderRadius = '50%';
            dot.style.border = '2px solid #fff';
            dot.style.boxShadow = '0 0 10px #06b6d4';
            dot.style.zIndex = '25';
            dot.style.transform = 'translate(-50%, -50%)';
            dot.style.left = x1 + 'px';
            dot.style.top = y1 + 'px';
            layer.appendChild(dot);

            const t0 = performance.now();
            function frame(now) {
                const p = Math.min((now - t0) / durMs, 1);
                dot.style.left = (x1 + (x2 - x1) * p) + 'px';
                dot.style.top = (y1 + (y2 - y1) * p) + 'px';
                if (p < 1) {
                    requestAnimationFrame(frame);
                } else {
                    dot.remove();
                    if (onComplete) onComplete();
                }
            }
            requestAnimationFrame(frame);
        }

        function explode(x, y, text) {
            const layer = document.getElementById('fxLayer');
            const el = document.createElement('div');
            el.className = 'blast-box';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.innerHTML = `
                <div style="font-size:2.2rem;">💥</div>
                <div style="background:#ef4444; color:#fff; font-weight:900; font-size:0.78rem; padding:4px 8px; border-radius:4px; margin-top:2px; white-space:nowrap; box-shadow:0 0 15px rgba(239,68,68,0.8);">
                    ${text}
                </div>
            `;
            layer.appendChild(el);
            setTimeout(() => el.remove(), 1800);
        }
    </script>
